# ==============================================================================
# Render Infrastructure as Code Blueprint
# Deploy GlobeTrek Holidays full-stack app on Render Free Tier
# ==============================================================================

services:
  - type: web
    name: globetrek-tourism
    env: python
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build && cd .. && pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NODE_VERSION
        value: 20.10.0
      - key: ENVIRONMENT
        value: production
